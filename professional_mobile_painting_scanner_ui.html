<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Alive Painting Scanner</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#000;
      overflow:hidden;
      width:100vw;
      height:100vh;
      position:relative;
    }

    #camera{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:1;
      background:black;
    }

    .overlay{
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
    }

    .top-bar{
      position:absolute;
      top:20px;
      left:20px;
      right:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      color:white;
      font-size:18px;
      font-weight:600;
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      padding:12px 18px;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .status-pill{
      color:#fff;
      font-size:13px;
      font-weight:500;
      padding:10px 16px;
      border-radius:50px;
      backdrop-filter:blur(10px);
      background:rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.12);
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .pulse{
      width:10px;
      height:10px;
      background:#00ff88;
      border-radius:50%;
      animation:pulse 1.5s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
        opacity:1;
      }
      50%{
        transform:scale(1.6);
        opacity:0.4;
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    .scanner-container{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:280px;
      height:360px;
      border-radius:30px;
      overflow:hidden;
      border:2px solid rgba(255,255,255,0.15);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 25px 60px rgba(0,0,0,0.45);
      backdrop-filter:blur(8px);
    }

    .scanner-border{
      position:absolute;
      inset:0;
      border-radius:30px;
    }

    .corner{
      position:absolute;
      width:40px;
      height:40px;
      border-color:#fff;
      border-style:solid;
      opacity:0.9;
    }

    .corner.top-left{
      top:18px;
      left:18px;
      border-width:4px 0 0 4px;
      border-radius:18px 0 0 0;
    }

    .corner.top-right{
      top:18px;
      right:18px;
      border-width:4px 4px 0 0;
      border-radius:0 18px 0 0;
    }

    .corner.bottom-left{
      bottom:18px;
      left:18px;
      border-width:0 0 4px 4px;
      border-radius:0 0 0 18px;
    }

    .corner.bottom-right{
      bottom:18px;
      right:18px;
      border-width:0 4px 4px 0;
      border-radius:0 0 18px 0;
    }

    .scan-line{
      position:absolute;
      left:0;
      width:100%;
      height:4px;
      background:linear-gradient(90deg, transparent, #00ff88, transparent);
      box-shadow:0 0 25px #00ff88;
      animation:scan 2.5s linear infinite;
    }

    @keyframes scan{
      0%{
        top:20px;
      }
      100%{
        top:320px;
      }
    }

    .bottom-panel{
      position:absolute;
      bottom:25px;
      left:20px;
      right:20px;
      z-index:3;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .instruction-card{
      padding:18px;
      border-radius:24px;
      backdrop-filter:blur(16px);
      background:rgba(0,0,0,0.42);
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 20px 50px rgba(0,0,0,0.45);
      color:white;
    }

    .instruction-title{
      font-size:18px;
      font-weight:600;
      margin-bottom:8px;
    }

    .instruction-text{
      font-size:13px;
      line-height:1.6;
      color:rgba(255,255,255,0.72);
    }

    .action-row{
      display:flex;
      gap:12px;
    }

    .action-btn{
      flex:1;
      height:56px;
      border:none;
      border-radius:20px;
      backdrop-filter:blur(16px);
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:15px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.08);
    }

    .primary{
      background:linear-gradient(135deg,#00ff88,#00c3ff);
      color:black;
      font-weight:700;
    }

    #videoOverlay{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:999;
      display:none;
      background:black;
    }

    .detect-animation{
      animation:detectFlash 0.8s ease;
    }

    @keyframes detectFlash{
      0%{
        transform:translate(-50%, -50%) scale(1);
      }
      50%{
        transform:translate(-50%, -50%) scale(1.04);
        box-shadow:0 0 80px rgba(0,255,136,0.7);
      }
      100%{
        transform:translate(-50%, -50%) scale(1);
      }
    }

    @media(max-width:420px){
      .scanner-container{
        width:240px;
        height:320px;
      }

      @keyframes scan{
        0%{
          top:20px;
        }
        100%{
          top:280px;
        }
      }
    }

  </style>
</head>
<body>

<video id="camera" autoplay playsinline></video>

<div class="overlay">

  <div class="top-bar">
    <div class="logo">Alive Painting</div>

    <div class="status-pill">
      <div class="pulse"></div>
      Scanning Artwork
    </div>
  </div>

  <div class="scanner-container" id="scannerBox">

    <div class="scanner-border">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>

    <div class="scan-line"></div>

  </div>

  <div class="bottom-panel">

    <div class="instruction-card">
      <div class="instruction-title">
        Bring Paintings To Life
      </div>

      <div class="instruction-text">
        Point your camera at the artwork to unlock an immersive cinematic animation experience.
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn">
        Gallery
      </button>

      <button class="action-btn primary" id="scanBtn">
        Scan Artwork
      </button>
    </div>

  </div>

</div>

<video id="videoOverlay" controls>
  <source src="painting-video.mp4" type="video/mp4">
</video>

<script>

const camera = document.getElementById('camera');
const overlayVideo = document.getElementById('videoOverlay');
const scannerBox = document.getElementById('scannerBox');

async function startCamera(){

  try{

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'environment'
      },
      audio:false
    });

    camera.srcObject = stream;

  }catch(err){
    alert('Camera permission required');
  }

}

startCamera();

function fakeDetectPainting(){

  setTimeout(()=>{

    scannerBox.classList.add('detect-animation');

    navigator.vibrate?.(200);

    setTimeout(()=>{
      playVideo();
    },700);

  },5000);

}

function playVideo(){

  overlayVideo.style.display = 'block';

  overlayVideo.play();

  overlayVideo.onended = ()=>{

    overlayVideo.style.display = 'none';

    scannerBox.classList.remove('detect-animation');

    fakeDetectPainting();

  }

}

camera.onloadeddata = ()=>{
  fakeDetectPainting();
}

</script>

</body>
</html>
